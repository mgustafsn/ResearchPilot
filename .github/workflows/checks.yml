name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: researchpilot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: researchpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - run: uv sync --locked --extra dev --python 3.14
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --junitxml=nfr-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: nfr-report.xml
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://researchpilot:test-only@localhost:5432/researchpilot_test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node --check frontend/app.js
      - run: uv build
