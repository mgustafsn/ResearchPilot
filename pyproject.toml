[project]
name = "researchpilot"
version = "0.17.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["nfr: non-functional requirement tests (docs/requirements.md §31)"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/superpowers"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["researchpilot*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
